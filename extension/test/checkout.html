<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dummy Checkout — Atlus Pay test page</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 420px;
        margin: 48px auto;
        color: #171717;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > div {
        flex: 1;
      }
      .order-total {
        margin-top: 24px;
        font-size: 16px;
        font-weight: 700;
      }
      #place-order {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        background: #171717;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Checkout</h1>
    <p>Fake store, fake order — just here to test the Atlus Pay extension's form detection and autofill.</p>

    <form id="checkout-form">
      <label for="cc-number">Card number</label>
      <input id="cc-number" name="cardnumber" autocomplete="cc-number" type="text" />

      <div class="row">
        <div>
          <label for="cc-expiry">Expiry</label>
          <input id="cc-expiry" name="expiry" autocomplete="cc-exp" type="text" placeholder="MM/YY" />
        </div>
        <div>
          <label for="cc-cvv">CVV</label>
          <input id="cc-cvv" name="cvv" autocomplete="cc-csc" type="text" />
        </div>
      </div>

      <div class="order-total">Total: <span id="total">49.99</span></div>

      <button id="place-order" type="button">Place order</button>
    </form>
  </body>
</html>
