<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dummy Gift-Card Checkout - Atlus Pay test page</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 420px;
        margin: 48px auto;
        color: #171717;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        margin-bottom: 16px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #171717;
        color: #fff;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Checkout</h1>
    <p>Fake store, fake order - tests Atlus Pay's gift-card-field detection.</p>

    <form id="checkout-form">
      <label for="gift-card-code">Gift card / promo code</label>
      <input id="gift-card-code" name="giftcard_code" type="text" />

      <p><strong>Total: 12.50</strong></p>

      <button type="submit">Place order</button>
    </form>
  </body>
</html>
