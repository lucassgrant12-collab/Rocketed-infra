<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlus Pay</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #171717;
      }
      .wrap {
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .amount {
        font-size: 28px;
        font-weight: 700;
        margin: 12px 0 20px;
      }
      .amount.unknown {
        font-size: 15px;
        font-weight: 500;
        color: #737373;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        margin-bottom: 16px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #confirm-btn {
        background: #171717;
        color: #ffffff;
      }
      #confirm-btn:disabled,
      #cancel-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #cancel-btn {
        background: #f5f5f5;
        color: #171717;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        color: #737373;
        min-height: 16px;
      }
      #status.error {
        color: #dc2626;
      }
      #status.success {
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Pay with Atlus</h1>
      <div id="amount" class="amount">—</div>
      <input type="text" id="manual-amount" placeholder="Enter amount (e.g. 49.99)" style="display: none" />
      <div class="actions">
        <button id="cancel-btn" type="button">Cancel</button>
        <button id="confirm-btn" type="button">Confirm</button>
      </div>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
