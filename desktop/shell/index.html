<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlus Pay</title>
    <style>
      body {
        margin: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        background: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-sizing: border-box;
      }
      button {
        border: none;
        background: #2a2a2a;
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #3a3a3a;
      }
      #address {
        flex: 1;
        height: 28px;
        border-radius: 6px;
        border: none;
        padding: 0 10px;
        font-size: 13px;
        outline: none;
      }
      #brand {
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 0 4px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <span id="brand">Atlus</span>
    <button id="back-btn" title="Back">&#8592;</button>
    <button id="forward-btn" title="Forward">&#8594;</button>
    <button id="reload-btn" title="Reload">&#8635;</button>
    <input id="address" type="text" placeholder="Search or enter a URL" />
    <button id="settings-btn" title="Settings">&#9881;</button>
    <script src="shell.js"></script>
  </body>
</html>
