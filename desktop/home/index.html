<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atlus</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #313338;
        color: #dbdee1;
        font-family: "gg sans", "Noto Sans", "Segoe UI", system-ui, sans-serif;
        font-size: 15px;
        overflow: hidden;
      }
      button { font: inherit; }
      svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      ::-webkit-scrollbar { width: 14px; height: 14px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #1a1b1e;
        border: 3px solid transparent;
        border-radius: 8px;
        background-clip: padding-box;
      }
      :focus-visible { outline: 2px solid #4f8df7; outline-offset: 2px; }

      .app { display: flex; height: 100vh; }

      /* ---------- sidebar ---------- */
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: #2b2d31;
      }
      .side-head {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-size: 15px;
        font-weight: 600;
        color: #f2f3f5;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
      }
      .channels { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
      .group-label {
        padding: 16px 8px 4px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #949ba4;
      }
      .channel {
        width: 100%;
        height: 34px;
        margin: 1px 0;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #949ba4;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
      }
      .channel:hover { background: #35373c; color: #dbdee1; }
      .channel.active { background: #404249; color: #fff; }
      .channel .count { font-size: 12px; font-weight: 600; color: #949ba4; }
      .channel.active .count { color: #dbdee1; }

      .user-panel {
        height: 52px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        background: #232428;
      }
      .avatar-wrap { position: relative; flex-shrink: 0; }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #404249;
        color: #dbdee1;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
      }
      .presence {
        position: absolute;
        right: -2px;
        bottom: -2px;
        border-radius: 50%;
        background: #80848e;
        border: 3px solid #232428;
        box-sizing: content-box;
        width: 8px;
        height: 8px;
      }
      .presence.on { background: #23a559; }
      .user-info { flex: 1; min-width: 0; line-height: 1.2; }
      .user-name { font-size: 14px; font-weight: 600; color: #f2f3f5; }
      .user-status {
        font-size: 12px;
        color: #949ba4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #b5bac1;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .icon-btn:hover { background: #35373c; color: #dbdee1; }

      /* ---------- main ---------- */
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .main-head {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
      }
      .head-title { font-size: 16px; font-weight: 600; color: #f2f3f5; white-space: nowrap; }
      .head-sep { width: 1px; height: 24px; background: #3f4147; }
      .head-sub {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: #949ba4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .search {
        width: 220px;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border-radius: 4px;
        background: #1e1f22;
        color: #949ba4;
      }
      .search svg { width: 15px; height: 15px; flex-shrink: 0; }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #dbdee1;
        font-size: 14px;
      }
      .search input::placeholder { color: #949ba4; }
      .search:focus-within { outline: 2px solid #4f8df7; }

      .scroll { flex: 1; overflow-y: auto; padding: 8px 24px 32px; }
      .section-head {
        margin: 20px 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #949ba4;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 8px;
      }
      .tile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #2b2d31;
        color: inherit;
        text-decoration: none;
      }
      .tile:hover { background: #35373c; }
      .tile-icon {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 12px;
        background: #404249;
        color: #dbdee1;
        display: grid;
        place-items: center;
        font-size: 17px;
        font-weight: 600;
        position: relative;
        overflow: hidden;
      }
      .tile-icon > * { grid-area: 1 / 1; }
      .tile-letter { visibility: hidden; }
      .tile-icon.no-logo .tile-letter { visibility: visible; }
      .tile-icon img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 5px;
      }
      .tile-text { min-width: 0; }
      .tile-name {
        font-size: 15px;
        font-weight: 600;
        color: #f2f3f5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile-sub { font-size: 13px; color: #949ba4; margin-top: 1px; }

      .state { max-width: 360px; margin: 72px auto 0; text-align: center; }
      .state-title { font-size: 16px; font-weight: 600; color: #f2f3f5; margin-bottom: 6px; }
      .state-body { font-size: 14px; line-height: 1.45; color: #949ba4; }
      .btn {
        margin-top: 16px;
        height: 32px;
        padding: 0 16px;
        border: 0;
        border-radius: 3px;
        background: #4f8df7;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn:hover { background: #3f7be0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="side-head">Store directory</div>
        <nav class="channels" id="categories" aria-label="Categories"></nav>

        <div class="user-panel">
          <div class="avatar-wrap">
            <div class="avatar">W</div>
            <span class="presence" id="presence"></span>
          </div>
          <div class="user-info">
            <div class="user-name">Wallet</div>
            <div class="user-status" id="wallet-status">Not connected</div>
          </div>
          <button class="icon-btn" id="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="main-head">
          <div class="head-title" id="head-title">All stores</div>
          <div class="head-sep"></div>
          <div class="head-sub">Pick a store, pay with crypto when you check out.</div>
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
            <input id="search" type="text" placeholder="Search" autocomplete="off" aria-label="Search stores" />
          </label>
        </header>

        <div class="scroll" id="scroll">
          <div id="results"></div>

          <div class="state" id="empty" hidden>
            <div class="state-title">No stores found</div>
            <div class="state-body" id="empty-body"></div>
          </div>

          <div class="state" id="error" hidden>
            <div class="state-title">Can't load the store list</div>
            <div class="state-body">Atlus couldn't reach its coordinator service. If you're running it yourself, check that it's started, then try again.</div>
            <button class="btn" id="retry">Try again</button>
          </div>
        </div>
      </main>
    </div>
    <script src="home.js"></script>
  </body>
</html>
